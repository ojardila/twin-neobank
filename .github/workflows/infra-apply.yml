name: Infra · Apply

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

# Serialize infra changes so two applies never race on the same state.
concurrency:
  group: infra-apply
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
  TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Init
        run: terraform init -input=false

      # A records used to be Terraform-managed; they're now owned by sync-dns.sh.
      # Forget them from state (without deleting the live records) so apply won't
      # destroy them. No-op once already removed.
      - name: Release legacy DNS records from state
        run: |
          terraform state rm 'digitalocean_record.root[0]' 2>/dev/null || true
          terraform state rm 'digitalocean_record.wildcard[0]' 2>/dev/null || true

      - name: Apply
        run: terraform apply -input=false -auto-approve

      # Install the ingress controller once (idempotent). Provisions a DO LB.
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$(terraform output -raw cluster_name)"

      - name: Ensure ingress-nginx (standard LB, no proxy protocol)
        run: |
          # Install the controller only if absent, so re-runs don't churn the LB.
          if ! kubectl -n ingress-nginx get deploy ingress-nginx-controller >/dev/null 2>&1; then
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/do/deploy.yaml
          else
            echo "ingress-nginx already installed — skipping upstream apply"
          fi
          # The upstream "do" manifest uses a REGIONAL_NETWORK LB + proxy protocol,
          # which does not forward reliably. Force a standard LB with no proxy protocol.
          kubectl -n ingress-nginx patch configmap ingress-nginx-controller \
            --type merge -p '{"data":{"use-proxy-protocol":"false"}}' || true
          kubectl apply -f ../../deploy/ingress-nginx/lb-service.yaml
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=200s || true

      - name: Ensure cert-manager + Let's Encrypt issuer
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=180s || true
          kubectl apply -f ../../deploy/cert-manager/cluster-issuer.yaml

      - name: Sync DNS to the live Load Balancer IP
        run: ../../deploy/scripts/sync-dns.sh argt.space
