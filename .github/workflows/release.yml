name: 🚀 Release

# Publish a GitHub Release (or run manually) to ship a versioned deploy:
#   1) provision/converge infrastructure (Terraform)
#   2) build + push images tagged with the release version
#   3) deploy to the cluster and wait for rollout
#   4) smoke-test the live endpoints
# Jobs are chained with `needs:` so infra always finishes before the app deploys.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. v0.1.0)"
        required: true
        default: "manual"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: twin-neobank-ojardila
  CLUSTER_NAME: twin-neobank
  NAMESPACE: twin-neobank
  APP_URL: https://argt.space

jobs:
  # ---------------------------------------------------------------------------
  prepare:
    name: 🔖 Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Releasing \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  infra:
    name: 🏗️ Provision infrastructure
    needs: prepare
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ env.CLUSTER_NAME }}"
      - name: Ensure ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/do/deploy.yaml
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=200s || true
      - name: Summary
        run: echo "✅ Infrastructure converged" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy:
    name: 🚢 Build & deploy app
    needs: [prepare, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1800
      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-backend:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-backend:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE=
            VITE_WC_PROJECT_ID=${{ vars.VITE_WC_PROJECT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-frontend:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-frontend:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ env.CLUSTER_NAME }}"

      - name: Deploy to cluster
        run: |
          V="${{ needs.prepare.outputs.version }}"
          kubectl apply -k deploy/k8s/overlays/prod
          kubectl -n "${{ env.NAMESPACE }}" set image deployment/twin-neobank-backend \
            backend=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-backend:$V
          kubectl -n "${{ env.NAMESPACE }}" set image deployment/twin-neobank-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-frontend:$V
          kubectl -n "${{ env.NAMESPACE }}" rollout status deployment/twin-neobank-backend --timeout=180s
          kubectl -n "${{ env.NAMESPACE }}" rollout status deployment/twin-neobank-frontend --timeout=180s

      - name: Summary
        run: |
          {
            echo "### 🚢 Deployed \`${{ needs.prepare.outputs.version }}\`"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| backend | \`${{ needs.prepare.outputs.version }}\` |"
            echo "| frontend | \`${{ needs.prepare.outputs.version }}\` |"
            echo ""
            echo "🌐 App: ${{ env.APP_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  smoke:
    name: ✅ Smoke test
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ env.CLUSTER_NAME }}"
      - name: Check pods & API from inside the cluster
        run: |
          kubectl -n "${{ env.NAMESPACE }}" get pods
          kubectl -n "${{ env.NAMESPACE }}" run smoke-$RANDOM --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- \
            -sf http://twin-neobank-backend:8080/healthz
          echo "✅ Backend health OK" >> "$GITHUB_STEP_SUMMARY"
