name: App · CD

# Manual-only. The primary deploy path is the Release pipeline (release.yml),
# which runs infra -> deploy in order. Use this for ad-hoc redeploys.
on:
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: twin-neobank-ojardila
  CLUSTER_NAME: twin-neobank
  NAMESPACE: twin-neobank

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-backend:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE=
            VITE_WC_PROJECT_ID=${{ vars.VITE_WC_PROJECT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-frontend:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/twin-neobank-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ env.CLUSTER_NAME }}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Deploy with Helm (pin SHA)
        run: |
          helm upgrade --install twin-neobank deploy/helm/twin-neobank \
            --namespace "${{ env.NAMESPACE }}" --create-namespace \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.tag="${{ github.sha }}" \
            --wait --timeout 5m
