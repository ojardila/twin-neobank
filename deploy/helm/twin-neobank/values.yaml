# Default values for the twin-neobank chart.

# Pull secret for the private DigitalOcean Container Registry.
# Created by Terraform in the target namespace (see infra/terraform).
imagePullSecrets:
  - name: docr-pull

backend:
  image:
    repository: registry.digitalocean.com/twin-neobank-ojardila/twin-neobank-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  # Optional: pull per-chain RPC URLs from a Secret named twin-neobank-rpc.
  envFrom: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

frontend:
  image:
    repository: registry.digitalocean.com/twin-neobank-ojardila/twin-neobank-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080 # nginx listens on 8080 inside the container
  service:
    port: 80 # cluster Service port the ingress targets
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: true
  className: nginx
  host: argt.space
  tls:
    enabled: true
    issuer: letsencrypt-prod # cert-manager ClusterIssuer
    secretName: argt-space-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

# On-chain config — surfaced to the backend via a ConfigMap (and to the frontend
# via /api/config). Change here to point at different contracts/chains.
config:
  argtToken: "0x59863989d080B22476DB95656d0C3CC18be92214"
  argtDecimals: "18"
  vaultAddress: "0x9Dd3F844747AB78d616BF76DB92756E17A064aDD"
  vaultChain: "arbitrum"
  chains:
    arbitrum:
      chainId: "42161"
      lzEid: "30110"
      adapter: "0x4821FBf47B261F0D52Ba0F941CF67b8648f82691"
      rpc: "https://arb1.arbitrum.io/rpc"
    base:
      chainId: "8453"
      lzEid: "30184"
      adapter: "0xe80Af1d12426dB4394b147e04f179a38e7C5Dfe7"
      rpc: "https://mainnet.base.org"
    polygon:
      chainId: "137"
      lzEid: "30109"
      adapter: "0xD70ad085684b2A9f4B5d54D7BDB2ecA37a273216"
      rpc: "https://polygon-rpc.com"
