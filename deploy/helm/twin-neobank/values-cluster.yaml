# Overrides for the self-hosted Talos cluster.
#
# Images come from Harbor on the tailnet rather than DigitalOcean's registry.
# Harbor is not reachable from the internet, so the cluster pulls over its own
# network and CI pushes by joining the tailnet for the duration of a build.

imagePullSecrets:
  - name: harbor-pull

# Images are pinned to a commit, not :latest.
#
# With a floating tag and IfNotPresent, a node that already has an image called
# "latest" never fetches the new one - CI pushes, the rollout restarts, and the
# same old bundle keeps serving. That is how a frontend built without its
# WalletConnect id stayed live after the fix was already in Harbor.
#
# Always-pull would also work but re-downloads on every restart; a real tag
# means the digest changes when the code does, which is what Kubernetes
# actually keys on.
backend:
  image:
    repository: harbor.int.engp.io/twin-neobank/twin-neobank-backend
    tag: 3e6aeab84c334fbc96a56bf58a2841387cf85f7f
  replicas: 2

frontend:
  image:
    repository: harbor.int.engp.io/twin-neobank/twin-neobank-frontend
    tag: 3e6aeab84c334fbc96a56bf58a2841387cf85f7f
  replicas: 2

# Routed through Cilium's Gateway rather than an Ingress: ingress-nginx is
# archived upstream and this cluster no longer runs it.
gateway:
  enabled: true
  name: public
  namespace: gateway

ingress:
  enabled: false
  className: nginx
  host: argt.space
  tls:
    # Cloudflare terminates TLS at its edge and the tunnel carries plain HTTP
    # from there, so there is no certificate for this cluster to present.
    enabled: false
