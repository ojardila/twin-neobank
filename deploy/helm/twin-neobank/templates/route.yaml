{{- if .Values.gateway.enabled }}
{{- /*
  Gateway API route for the self-hosted cluster. The DigitalOcean deployment
  keeps using the Ingress in ingress.yaml; this is switched on by
  values-cluster.yaml, where ingress-nginx no longer exists.

  Service names are literal here, matching backend.yaml and frontend.yaml -
  this chart does not define a fullname helper.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: twin-neobank
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    # The API prefix has to be matched before the catch-all, or every request
    # lands on the frontend.
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: twin-neobank-backend
          port: {{ .Values.backend.port }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: twin-neobank-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
