{{- if .Values.gateway.enabled }}
{{- /*
  Gateway API route for the self-hosted cluster. The DigitalOcean deployment
  keeps using the Ingress in ingress.yaml; this one is switched on by
  values-cluster.yaml, where ingress-nginx no longer exists.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "twin-neobank.fullname" . }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    # The API prefix has to come first, or the catch-all swallows it and every
    # request lands on the frontend.
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: {{ include "twin-neobank.fullname" . }}-backend
          port: {{ .Values.backend.port }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "twin-neobank.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
