apiVersion: apps/v1
kind: Deployment
metadata:
  name: twin-neobank-backend
  labels:
    app: twin-neobank-backend
    {{- include "twin-neobank.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: twin-neobank-backend
  template:
    metadata:
      labels:
        app: twin-neobank-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
          envFrom:
            # Contract/chain config (addresses, EIDs, chain ids) — see configmap.yaml.
            - configMapRef:
                name: twin-neobank-config
            {{- with .Values.backend.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # distroless:nonroot user UID — required because runAsNonRoot needs
            # a numeric user (the image's "nonroot" name can't be verified).
            runAsUser: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: twin-neobank-backend
  labels:
    {{- include "twin-neobank.labels" . | nindent 4 }}
spec:
  selector:
    app: twin-neobank-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
