apiVersion: apps/v1
kind: Deployment
metadata:
  name: twin-neobank-backend
  labels:
    app: twin-neobank-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: twin-neobank-backend
  template:
    metadata:
      labels:
        app: twin-neobank-backend
    spec:
      containers:
        - name: backend
          image: twin-neobank-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: twin-neobank-rpc
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: twin-neobank-backend
spec:
  selector:
    app: twin-neobank-backend
  ports:
    - port: 8080
      targetPort: 8080
