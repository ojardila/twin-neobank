apiVersion: apps/v1
kind: Deployment
metadata:
  name: twin-neobank-frontend
  labels:
    app: twin-neobank-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twin-neobank-frontend
  template:
    metadata:
      labels:
        app: twin-neobank-frontend
    spec:
      containers:
        - name: frontend
          image: twin-neobank-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: twin-neobank-frontend
spec:
  selector:
    app: twin-neobank-frontend
  ports:
    - port: 80
      targetPort: 8080
