apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twin-neobank
  annotations:
    # Adjust to your ingress controller / cert-manager setup.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: argt.space
      http:
        paths:
          # API to the Go backend.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: twin-neobank-backend
                port:
                  number: 8080
          # Everything else to the SPA.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twin-neobank-frontend
                port:
                  number: 80
