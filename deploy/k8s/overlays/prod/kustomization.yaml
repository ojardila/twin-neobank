apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is created by Terraform (with the DOCR pull secret on its default SA).
namespace: twin-neobank

resources:
  - ../../base

# Map the neutral image names to the DigitalOcean Container Registry.
# CI overrides newTag with the commit SHA via `kubectl set image` (see cd.yml).
images:
  - name: twin-neobank-backend
    newName: registry.digitalocean.com/twin-neobank-ojardila/twin-neobank-backend
    newTag: latest
  - name: twin-neobank-frontend
    newName: registry.digitalocean.com/twin-neobank-ojardila/twin-neobank-frontend
    newTag: latest
