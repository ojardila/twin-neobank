# Let's Encrypt production issuer, solving the HTTP-01 challenge through the
# nginx ingress. cert-manager will auto-issue and renew the argt.space cert
# once DNS points at the ingress Load Balancer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: oscar3425@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
