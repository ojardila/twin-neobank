# Local test stack: Go backend + nginx-served frontend.
# Usage:  docker compose up --build   ->  open http://localhost:3000
services:
  # Service name matches nginx.conf proxy_pass (twin-neobank-backend).
  twin-neobank-backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      PORT: "8080"
      # Optional: override public RPCs with your own for reliability.
      # RPC_ARBITRUM: https://...
      # RPC_BASE: https://...
      # RPC_POLYGON: https://...
    ports:
      - "8080:8080" # direct access to the API for debugging

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE: "" # same-origin; nginx proxies /api -> backend
        VITE_WC_PROJECT_ID: "${VITE_WC_PROJECT_ID:-twin-neobank-dev}"
    ports:
      - "3000:8080"
    depends_on:
      - twin-neobank-backend
